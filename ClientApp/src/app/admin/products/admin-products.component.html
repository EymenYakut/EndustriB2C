<div class="admin-head">
  <h1>Ürünler</h1>
  <button class="btn-accent" type="button" (click)="startNew()">Yeni ürün</button>
</div>
<table class="admin-table">
  <tr><th>SKU</th><th>Ad</th><th>Üretici</th><th>Kategori</th><th>Stok</th><th>Durum</th><th></th></tr>
  <tr *ngFor="let p of products">
    <td>{{ p.sku }}</td>
    <td>{{ p.name }}</td>
    <td>{{ p.manufacturer || '-' }}</td>
    <td>{{ categoryNames(p) }}</td>
    <td>{{ p.stock }}</td>
    <td>{{ p.isActive ? 'Aktif' : 'Pasif' }}</td>
    <td>
      <button class="linkish" type="button" (click)="edit(p)">Düzenle</button>
      <button class="linkish" type="button" (click)="remove(p.id)">Sil</button>
    </td>
  </tr>
</table>

<div class="admin-modal-backdrop" *ngIf="editing" (click)="editing=null">
  <form class="admin-modal" (click)="$event.stopPropagation()" (ngSubmit)="save()">
    <button class="admin-modal-close" type="button" (click)="editing=null" aria-label="Kapat">×</button>
    <h3>{{ editing.id ? 'Ürün düzenle' : 'Yeni ürün' }}</h3>
    <div class="form-grid">
      <label>SKU<input [(ngModel)]="editing.sku" name="sku" required></label>
      <label>Üretici<input [(ngModel)]="editing.manufacturer" name="manufacturer" placeholder="GASSO, SEL, Continental..."></label>
      <label>Stok<input type="number" [(ngModel)]="editing.stock" name="stock"></label>
      <label>Sıra<input type="number" [(ngModel)]="editing.sortOrder" name="sortOrder"></label>
      <label class="check"><input type="checkbox" [(ngModel)]="editing.isActive" name="isActive"> Aktif</label>
      <div class="full">
        <strong>Kategoriler</strong>
        <div *ngFor="let main of mainCategories" style="margin:10px 0 14px">
          <div style="font-weight:700;margin-bottom:6px">{{ main.name }}</div>
          <label class="check" *ngFor="let s of childrenOf(main)">
            <input type="checkbox" [checked]="isCatSelected(s.id)" (change)="toggleCat(s.id, $event)"> {{ s.name }}
          </label>
        </div>
      </div>
    </div>
    <h4>Çeviriler</h4>
    <div *ngFor="let t of editing.translations; let i = index" class="form-grid">
      <label>Dil<input [(ngModel)]="t.languageCode" [name]="'lang'+i"></label>
      <label>Ad<input [(ngModel)]="t.name" [name]="'name'+i" required></label>
      <label class="full">Kısa açıklama<input [(ngModel)]="t.shortDescription" [name]="'sd'+i"></label>
      <label class="full">Açıklama<textarea [(ngModel)]="t.description" [name]="'d'+i"></textarea></label>
    </div>
    <h4>Özellikler</h4>
    <div class="form-grid">
      <label *ngFor="let f of editing.features; let i = index">
        {{ featureName(f.headerId) }}
        <input [(ngModel)]="f.value" [name]="'fv'+i">
      </label>
    </div>
    <div *ngIf="editing.id">
      <h4>Görseller</h4>
      <div class="img-row">
        <span *ngFor="let img of editing.images">
          <img [src]="img.filePath" alt="">
          <button type="button" (click)="deleteImage(img.id)">Sil</button>
        </span>
      </div>
      <input type="file" accept="image/png,image/jpeg,image/webp" (change)="upload($event)">
    </div>
    <p class="err" *ngIf="error">{{ error }}</p>
    <div class="admin-modal-actions">
      <button class="btn-accent" type="submit">Kaydet</button>
      <button class="linkish" type="button" (click)="editing=null">Vazgeç</button>
    </div>
  </form>
</div>
