<div class="admin-login">
  <form class="form-card narrow" (ngSubmit)="submit()">
    <h1>Yönetim Girişi</h1>
    <label>E-posta<input [(ngModel)]="email" name="email" type="email" required></label>
    <label>Şifre<input [(ngModel)]="password" name="password" type="password" required></label>
    <p class="err" *ngIf="error">{{ error }}</p>
    <button class="btn-accent" type="submit">Giriş</button>
  </form>
</div>
